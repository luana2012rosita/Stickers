name: Generar APK de Stickers

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Instalar y Compilar React
      run: |
        npm install
        npm run build

    - name: Instalar Capacitor y Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "Calculadora Stickers" "com.luana.stickers" --web-dir=dist
        npx cap add android
        npx cap sync

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Compilar APK con Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug

    - name: Subir Archivo APK Listo
      uses: actions/upload-artifact@v4
      with:
        name: Calculadora-Stickers-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
        overwrite: true
        
